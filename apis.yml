aid: velt
url: https://raw.githubusercontent.com/api-evangelist/velt/refs/heads/main/apis.yml
name: Velt
kind: company
description: Velt is a real-time collaboration platform delivered primarily as a client
  SDK (React components and framework wrappers) for adding presence, live cursors,
  comments, notifications, huddles, recordings, and live selection to applications.
  Its server-side surface is the Velt Data (REST) API at api.velt.dev plus signed,
  retried webhooks, letting backends read and write comments, users, organizations,
  folders, documents, notifications, and user groups programmatically.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Real-Time Collaboration
- Comments
- Presence
- Notifications
- SDK
- Webhooks
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
