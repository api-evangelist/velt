meters:
- name: monthly_active_documents
  description: Documents with active collaboration in a billing month - the primary billing meter.
  unit: documents
  aggregation: count
  dimensions:
  - account
  - organization
- name: simultaneous_connections
  description: Concurrent real-time client connections, capped by plan tier.
  unit: connections
  aggregation: max
  dimensions:
  - account
- name: file_storage
  description: File storage consumed by collaboration attachments and recordings, by plan.
  unit: bytes
  aggregation: max
  dimensions:
  - account
- name: webhook_deliveries
  description: Webhook event deliveries dispatched to configured endpoints, including retries.
  unit: deliveries
  aggregation: sum
  dimensions:
  - account
  - endpoint
principles:
- name: Visibility
  description: Track active documents (MADs) and connection peaks in the Velt admin console against the plan allowance.
- name: Allocation
  description: Map organizations and documents in Velt to internal teams/tenants to attribute MAD-driven cost.
- name: Optimization
  description: Scope collaboration to documents that genuinely need it and retire stale documents so they stop counting as active.
- name: Accountability
  description: Assign owners per organization/workspace; review MAD growth and connection ceilings monthly against contract.
