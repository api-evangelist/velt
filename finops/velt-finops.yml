description: >-
  FinOps view of Velt spend. Velt bills on Monthly Active Documents (MADs) -
  documents that see active collaboration in a billing month - rather than per
  seat, per API call, or per connection. The free Hacker tier covers 100 MADs in
  development; Growth and Enterprise are contract-based with negotiated MAD
  volumes plus connection ceilings, storage, SLAs, and hosting/compliance
  options. Because both the client SDK and the server-side Data (REST) API and
  webhooks resolve to the same documents, cost is driven by how many documents
  are actively collaborated on, not by request volume.
notes: >-
  MAD volumes and contract terms for Growth and Enterprise are negotiated with
  Velt sales; verify against the Velt pricing page during reconciliation.
