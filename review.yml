aid: velt
name: Velt
review:
  question: Does Velt expose a documented public WebSocket API?
  answer: false
  date: '2026-07-01'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Velt's real-time transport (presence, cursors, live comments) is delivered
    through the client SDK and is not documented as a developer-facing WebSocket
    API surface that a consumer connects to and drives directly. The documented,
    consumer-addressable server surfaces are the Velt Data (REST) API at
    api.velt.dev/v2 and outbound signed webhooks. No AsyncAPI document was
    authored because there is no documented public WebSocket contract and the
    webhook surface is modeled as REST configuration plus HTTP callbacks.
findings:
  summary: |
    Velt is primarily a client-side collaboration SDK. Real-time behavior is an
    implementation detail of the SDK and Velt's managed infrastructure; there is
    no documented public WebSocket (ws:// or wss://) API that developers connect
    to and operate directly. The documented public server-side surfaces are the
    Velt Data (REST) API - HTTPS POST endpoints under
    https://api.velt.dev/v2 authenticated with x-velt-api-key and
    x-velt-auth-token headers - and advanced webhooks, which are HMAC-signed
    HTTP callbacks configured via the REST API and retried with exponential
    backoff. Events are generated by both human and agent activity.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.velt.dev/v2
      documented: true
    - protocol: Webhook
      scheme: https
      note: Outbound HMAC-signed HTTP callbacks to a consumer-controlled URL, configured via the REST API and retried with exponential backoff.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: Real-time transport is handled inside the Velt SDK and managed infrastructure; no public WebSocket API contract is documented for direct consumer use.
  endpointsConfirmedRest:
    - POST https://api.velt.dev/v2/comments/add
    - POST https://api.velt.dev/v2/comments/get
    - POST https://api.velt.dev/v2/comments/update
    - POST https://api.velt.dev/v2/comments/delete
    - POST https://api.velt.dev/v2/users/add
    - POST https://api.velt.dev/v2/users/get
    - POST https://api.velt.dev/v2/organizations/add
    - POST https://api.velt.dev/v2/organizations/get
    - POST https://api.velt.dev/v2/documents/add
    - POST https://api.velt.dev/v2/documents/get
    - POST https://api.velt.dev/v2/notifications/config/get
    - POST https://api.velt.dev/v2/notifications/config/set
sources:
  - url: https://velt.dev/docs/api-reference/rest-apis
    type: APIReference
    note: Data API endpoints are HTTPS POST calls under api.velt.dev/v2 with a top-level data object and x-velt-api-key / x-velt-auth-token headers.
  - url: https://velt.dev/webhooks-and-api
    type: Documentation
    note: Describes REST APIs plus signed, retried webhooks as the server-side surface; no public WebSocket API for direct consumer use.
  - url: https://velt.dev/docs/webhooks/advanced
    type: Documentation
    note: Advanced webhooks are HMAC-signed HTTP callbacks with retry/backoff; verified via the signature header.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No documented public WebSocket API surface exists for direct consumer use,
    so no AsyncAPI document was authored. The apis.yml models the documented
    consumer-addressable surfaces: the Data (REST) API resource groups and the
    webhooks configuration/event surface.
